name: id_namespace
description: A Dart package providing an registry for id_pair_sets.
version: 1.0.1
repository: https://github.com/staylorx/id_namespace
issue_tracker: https://github.com/staylorx/id_namespace/issues
documentation: https://github.com/staylorx/id_namespace

environment:
  sdk: ^3.10.0

# Add regular dependencies here.
dependencies:
  dio: ^5.4.0
  equatable: ^2.0.7
  fpdart: ^1.2.0
  logging: ^1.2.0
  rdf_core: ^0.9.24
  rdf_xml: 0.4.6
  uuid: ^4.5.2

dev_dependencies:
  lints: ^6.0.0
  mocktail: ^1.0.3
  path: ^1.9.1
  test: ^1.25.6
  # Scripts contract (bible §2.1): CI/agents invoke `dart run melos run <task>`.
  melos: ^8.8.0

melos:
  useRootAsPackage: true
  scripts:
    analyze:
      run: dart analyze --fatal-infos --fatal-warnings
    test:
      run: dart test
    clean:deep:
      description: >
        Targeted deep clean of generated artifacts — removes .dart_tool/,
        build/, and .logs/ at the package root. Uses tool/clean_deep.dart (pure
        dart:io, cross-platform) rather than bare `git clean -fdx`, which would
        delete pubspec.lock (ignored via .gitignore) and .idea/. Never touches
        source, pubspec.yaml, .gitignore, or AGENTS.md.
      run: dart run tool/clean_deep.dart
